<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Dynamic Dropdowns</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin: 10px 0;
        }
        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        select, input {
            padding: 8px;
            margin: 5px 0;
            width: 100%;
        }
        .dropdown-section {
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .occupation-section {
            background: #e8f5e8;
            border-left: 4px solid #27ae60;
        }
        .family-section {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1>🧪 Test Dynamic Dropdowns</h1>
    
    <div class="form-group">
        <label><strong>Occupation Status *</strong></label>
        <div class="radio-group">
            <div class="radio-option">
                <input type="radio" id="has-occupation" name="occupation" value="true" onchange="toggleDropdowns()">
                <label for="has-occupation">Has Occupation</label>
            </div>
            <div class="radio-option">
                <input type="radio" id="no-occupation" name="occupation" value="false" onchange="toggleDropdowns()">
                <label for="no-occupation">No Occupation (Family Role)</label>
            </div>
        </div>
    </div>

    <div id="occupation-section" class="dropdown-section occupation-section hidden">
        <label for="occupation-group"><strong>Occupation Group *</strong></label>
        <select id="occupation-group">
            <option value="">Select Occupation Group</option>
            <option value="Manufacturing and mining">Manufacturing and mining</option>
            <option value="Service and hospitality">Service and hospitality</option>
            <option value="Trade and commerce">Trade and commerce</option>
            <option value="Agriculture">Agriculture</option>
            <option value="Government">Government</option>
            <option value="Education, sciences">Education, sciences</option>
            <option value="Arts, entertainment, sports">Arts, entertainment, sports</option>
        </select>
        <small style="color: #27ae60;">📋 Select your occupation category</small>
    </div>

    <div id="family-section" class="dropdown-section family-section hidden">
        <label for="family-role"><strong>Family Role *</strong></label>
        <select id="family-role">
            <option value="">Select Family Role</option>
            <option value="WIFE">WIFE</option>
            <option value="SON">SON</option>
            <option value="DAUGHTER">DAUGHTER</option>
            <option value="HUSBAND">HUSBAND</option>
            <option value="HEAD">HEAD</option>
            <option value="CHILD">CHILD</option>
            <option value="INFANT">INFANT</option>
            <option value="SERVANT">SERVANT</option>
            <option value="RELATIVE">RELATIVE</option>
        </select>
        <small style="color: #856404;">👨‍👩‍👧‍👦 Select your family relationship</small>
    </div>

    <div style="margin-top: 30px;">
        <button onclick="showSelected()">Show Selected Values</button>
        <button onclick="resetForm()">Reset Form</button>
    </div>

    <div id="output" style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px;"></div>

    <script>
        function toggleDropdowns() {
            console.log('toggleDropdowns called');
            
            const hasOccupation = document.getElementById('has-occupation').checked;
            const occupationSection = document.getElementById('occupation-section');
            const familySection = document.getElementById('family-section');
            const occupationSelect = document.getElementById('occupation-group');
            const familySelect = document.getElementById('family-role');

            console.log('hasOccupation:', hasOccupation);

            if (hasOccupation) {
                console.log('Showing occupation dropdown');
                occupationSection.classList.remove('hidden');
                familySection.classList.add('hidden');
                occupationSelect.required = true;
                familySelect.required = false;
                familySelect.value = '';
            } else {
                console.log('Showing family role dropdown');
                occupationSection.classList.add('hidden');
                familySection.classList.remove('hidden');
                occupationSelect.required = false;
                familySelect.required = true;
                occupationSelect.value = '';
            }
        }

        function showSelected() {
            const hasOccupation = document.getElementById('has-occupation').checked;
            const occupationGroup = document.getElementById('occupation-group').value;
            const familyRole = document.getElementById('family-role').value;
            
            let output = '<h3>Selected Values:</h3>';
            output += `<p><strong>Has Occupation:</strong> ${hasOccupation}</p>`;
            
            if (hasOccupation) {
                output += `<p><strong>Occupation Group:</strong> ${occupationGroup || 'Not selected'}</p>`;
            } else {
                output += `<p><strong>Family Role:</strong> ${familyRole || 'Not selected'}</p>`;
            }
            
            document.getElementById('output').innerHTML = output;
        }

        function resetForm() {
            document.querySelectorAll('input[name="occupation"]').forEach(radio => radio.checked = false);
            document.getElementById('occupation-group').value = '';
            document.getElementById('family-role').value = '';
            document.getElementById('occupation-section').classList.add('hidden');
            document.getElementById('family-section').classList.add('hidden');
            document.getElementById('output').innerHTML = '';
        }
    </script>
</body>
</html>
